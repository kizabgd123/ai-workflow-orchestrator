name: Cleanup stale submodule metadata



on:

  push:
  
    branches:
    
      - fix/pages-docs-deployment
      


permissions:

  contents: write
  


jobs:

  cleanup:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
        with:
        
          fetch-depth: 0
          


      - name: Remove invalid submodule gitlink
      
        run: |
        
          git rm -f --cached pickle-rick-extension
          
          rm -rf pickle-rick-extension
          
          rm -f .github/workflows/cleanup-stale-submodule.yml
          
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git diff --cached --quiet || git commit -m "fix(repo): remove stale submodule metadata"
          
          git push
          




















