name: Cleanup remaining stale submodules



on:

  push:
  
    branches:
    
      - fix/pages-docs-deployment
      


permissions:

  contents: write
  


jobs:

  cleanup:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
        with:
        
          fetch-depth: 0
          


      - name: Remove invalid submodule gitlinks
      
        run: |
        
          git rm -f --cached temp_hf tiny-rick
          
          rm -rf temp_hf tiny-rick
          
          rm -f .github/workflows/cleanup-remaining-stale-submodules.yml
          
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git diff --cached --quiet || git commit -m "fix(repo): remove remaining stale submodules"
          
          git push
          




















